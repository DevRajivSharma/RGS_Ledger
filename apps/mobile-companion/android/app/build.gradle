plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

android {
    namespace "com.rgsledger.companion"
    compileSdk 34

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.rgsledger.companion"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            // Default Android debug signing
        }
        release {
            def signingPropsFile = rootProject.file('release-signing.properties')
            def signingProps = new Properties()
            if (signingPropsFile.exists()) {
                signingPropsFile.withInputStream { stream -> signingProps.load(stream) }
            }

            def rawPath = System.getenv("ANDROID_KEYSTORE_PATH") ?:
                          signingProps.getProperty("RGS_RELEASE_STORE_FILE") ?:
                          (project.hasProperty("RGS_RELEASE_STORE_FILE") ? project.property("RGS_RELEASE_STORE_FILE") : null) ?:
                          "keystore/release.keystore"

            def resolvedKeystore = file(rawPath)
            if (!resolvedKeystore.exists()) {
                def rootCandidate = rootProject.file(rawPath)
                if (rootCandidate.exists()) {
                    resolvedKeystore = rootCandidate
                }
            }

            if (resolvedKeystore.exists()) {
                storeFile resolvedKeystore
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?:
                              signingProps.getProperty("RGS_RELEASE_STORE_PASSWORD") ?:
                              (project.hasProperty("RGS_RELEASE_STORE_PASSWORD") ? project.property("RGS_RELEASE_STORE_PASSWORD") : "")
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?:
                         signingProps.getProperty("RGS_RELEASE_KEY_ALIAS") ?:
                         (project.hasProperty("RGS_RELEASE_KEY_ALIAS") ? project.property("RGS_RELEASE_KEY_ALIAS") : "rgsledger")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?:
                            signingProps.getProperty("RGS_RELEASE_KEY_PASSWORD") ?:
                            (project.hasProperty("RGS_RELEASE_KEY_PASSWORD") ? project.property("RGS_RELEASE_KEY_PASSWORD") : "")
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField "String", "DEFAULT_API_URL", "\"http://10.0.2.2:4000\""
            signingConfig signingConfigs.debug
        }
        release {
            def prodApiUrl = System.getenv("RGS_API_URL") ?:
                             (project.hasProperty("RGS_API_URL") ? project.property("RGS_API_URL") : null) ?:
                             "https://api.rgsledger.rajivsharma.online"
            buildConfigField "String", "DEFAULT_API_URL", "\"${prodApiUrl}\""

            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            }

            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"

    // Room Database
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // OkHttp & Gson
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.google.code.gson:gson:2.10.1"

    // Unit Testing
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:5.11.0"
}
