services:
  - type: web
    name: rgs-ledger-api
    env: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build --workspace=@rgs-ledger/api
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ENCRYPTION_KEY_HEX
        sync: false
      - key: SCHEDULER_SHARED_SECRET
        sync: false
      - key: ALLOWED_CORS_ORIGINS
        sync: false
